name: keep-warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Vercel functions warm
        run: |
          curl -s -o /dev/null -m 20 https://www.hermtica.com/ || true
          curl -s -o /dev/null -m 20 https://www.hermtica.com/marketplace || true
          curl -s -o /dev/null -m 20 https://www.hermtica.com/api/health || true
